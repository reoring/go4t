apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-drain-shell-nginx
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-drain-shell-nginx
  template:
    metadata:
      labels:
        app: node-drain-shell-nginx
    spec:
      terminationGracePeriodSeconds: 5
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [go4t-drain-shell-worker]
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 1
