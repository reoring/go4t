name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: Run examples
        shell: bash
        run: |
          set -euo pipefail
          for source in examples/*/main.gt; do
            directory="${source%/*}"
            input=/dev/null
            if [[ -f "$directory/input.txt" ]]; then
              input="$directory/input.txt"
            fi
            args=()
            if [[ -f "$directory/args.txt" ]]; then
              # Argument fixtures are whitespace-separated, without shell evaluation.
              read -r -d '' -a args < "$directory/args.txt" || true
            fi
            sources=("$source")
            if [[ -f "$directory/gostd.gt" ]]; then
              sources+=("$directory/gostd.gt")
            fi
            echo "Running $source"
            directory_sources=("$directory"/*.gt)
            bad_sources=("$directory"/bad_*.gt)
            if (( ${#directory_sources[@]} > 1 )) && [[ ! -f "${bad_sources[0]}" ]]; then
              go run ./cmd/go4t run "$directory" -- "${args[@]}" < "$input"
            else
              go run ./cmd/go4t run "${sources[@]}" -- "${args[@]}" < "$input"
            fi
          done
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Enforce benchmark budgets
        run: go test ./bench -run . -bench . -benchtime=1x -timeout=12m
