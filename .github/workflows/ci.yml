name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    # The minimum supported Go (the `go` line in go.mod) and the current stable
    # release: bindings are generated from the toolchain's own export data, so
    # both ends are checked.
    strategy:
      fail-fast: false
      matrix:
        go: [minimum, stable]
    name: go (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.go == 'minimum'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-go@v5
        if: matrix.go == 'stable'
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - name: Run examples
        shell: bash
        run: |
          set -euo pipefail
          for source in examples/*/main.gt; do
            directory="${source%/*}"
            if [[ -f "$directory/skip.txt" ]]; then
              reason=
              IFS= read -r reason < "$directory/skip.txt" || true
              printf 'skip %s: %s\n' "${directory##*/}" "$reason"
              continue
            fi
            input=/dev/null
            if [[ -f "$directory/input.txt" ]]; then
              input="$directory/input.txt"
            fi
            args=()
            if [[ -f "$directory/args.txt" ]]; then
              # Argument fixtures are whitespace-separated, without shell evaluation.
              read -r -d '' -a args < "$directory/args.txt" || true
            fi
            sources=("$source")
            if [[ -f "$directory/gostd.gt" ]]; then
              sources+=("$directory/gostd.gt")
            fi
            echo "Running $source"
            # Use directory form only when the example has one entry point.
            if [[ $(grep -l '^func main' "$directory"/*.gt | wc -l) -eq 1 ]]; then
              go run ./cmd/go4t run "$directory" -- "${args[@]}" < "$input"
            else
              go run ./cmd/go4t run "${sources[@]}" -- "${args[@]}" < "$input"
            fi
          done
      - name: Bootstrap self-hosted compiler
        run: bash selfhost/bootstrap.sh
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Enforce benchmark budgets
        run: go test ./bench -run . -bench . -benchtime=1x -timeout=12m
